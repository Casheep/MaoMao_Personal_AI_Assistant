name: Build beta packages

on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-release.txt

      - name: Verify source
        run: python -m unittest discover -s tests -q

      - name: Download wake-word model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force engines/vosk | Out-Null
          Invoke-WebRequest `
            -Uri "https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip" `
            -OutFile "$env:RUNNER_TEMP/vosk.zip"
          Expand-Archive "$env:RUNNER_TEMP/vosk.zip" engines/vosk -Force

      - name: Build Windows packages
        shell: pwsh
        run: |
          ./build-beta-packages.ps1 -Edition lite -PythonHome $env:pythonLocation -CompileLauncher
          ./build-beta-packages.ps1 -Edition full -PythonHome $env:pythonLocation -CompileLauncher

      - name: Verify launcher
        shell: pwsh
        run: |
          ./dist/MaoMao-beta-lite/MaoMao.exe --check
          ./dist/MaoMao-beta-full/MaoMao.exe --check

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: MaoMao-beta-Windows
          path: |
            dist/MaoMao-beta-lite.zip
            dist/MaoMao-beta-full.zip
          if-no-files-found: error
